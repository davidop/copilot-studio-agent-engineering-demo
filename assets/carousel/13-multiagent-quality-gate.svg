<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Quality Gate multiagente" width="1200" height="1500" viewBox="0 0 1200 1500"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#051632"/><stop offset=".58" stop-color="#092855"/><stop offset="1" stop-color="#24255e"/></linearGradient><linearGradient id="glass"><stop stop-color="#183e79"/><stop offset="1" stop-color="#252769"/></linearGradient><linearGradient id="hot"><stop stop-color="#04c6ea"/><stop offset="1" stop-color="#ad5aff"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#58e0ed"/></marker></defs><rect width="1200" height="1500" fill="url(#bg)"/><path d="M0 1395 Q200 1350 400 1400 T800 1400 T1200 1375 V1500 H0Z" fill="#8bb8ef" opacity=".85"/><path d="M0 1453 Q300 1390 590 1450 T1200 1440 V1500 H0Z" fill="#d5ebff"/><g fill="#c4dcff" opacity=".65"><circle cx="70" cy="166" r="6"/><circle cx="1070" cy="260" r="7"/><circle cx="1125" cy="1080" r="5"/><circle cx="82" cy="1180" r="8"/></g><text x="70" y="85" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="39" font-weight="700" fill="#8ddaff">❄</text><text x="1114" y="85" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="36" font-weight="700" fill="#8ddaff">❄</text><text x="600" y="112" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="52" font-weight="700" fill="#fff">Quality Gate multiagente</text><text x="600" y="177" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="500" fill="#75e5ff">Una buena respuesta no basta</text><rect x="1005" y="24" width="154" height="57" rx="28" fill="#162755" stroke="#809df2" stroke-width="3"/><text x="1082" y="63" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#e8f6ff">20 MIN</text>
<rect x="65" y="280" width="1070" height="146" rx="25" fill="#102f63" stroke="#24d5ec" stroke-width="3"/><text x="600" y="339" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#e9f7ff">1 · CALIDAD CONVERSACIONAL</text><text x="600" y="384" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="500" fill="#a8e5fb">Corrección, seguridad y claridad de la respuesta</text>
<path d="M600 430 V491" stroke="#58e0ed" stroke-width="6" fill="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="65" y="497" width="1070" height="146" rx="25" fill="#252061" stroke="#ae7aff" stroke-width="3"/><text x="600" y="557" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#e9f7ff">2 · DELEGACIÓN OBSERVADA</text><text x="600" y="601" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="500" fill="#dbccff">¿Qué connected agents se invocaron realmente?</text>
<path d="M600 647 V708" stroke="#58e0ed" stroke-width="6" fill="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="65" y="716" width="1070" height="147" rx="25" fill="#102f63" stroke="#24d5ec" stroke-width="3"/><text x="600" y="776" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#e9f7ff">3 · SEGURIDAD Y PERMISOS</text><text x="600" y="820" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="500" fill="#a8e5fb">Sin secretos, sin operaciones sobre equipos reales</text>
<path d="M600 866 V932" stroke="#58e0ed" stroke-width="6" fill="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="65" y="941" width="1070" height="148" rx="25" fill="#252061" stroke="#ae7aff" stroke-width="3"/><text x="600" y="999" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#e9f7ff">4 · CONSUMO Y TRAZABILIDAD</text><text x="600" y="1046" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="500" fill="#dbccff">Medir lo disponible; documentar limitaciones</text>
<path d="M600 1093 V1155" stroke="#58e0ed" stroke-width="6" fill="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="195" y="1168" width="810" height="153" rx="38" fill="#0a405c" stroke="#27d6c8" stroke-width="3"/><text x="600" y="1231" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="37" font-weight="700" fill="#e9f7ff">DECISIÓN DE RELEASE</text><text x="600" y="1278" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="500" fill="#b1fff1">Aprobar o iterar tras revisar la evidencia</text>
<rect x="90" y="1380" width="1020" height="71" rx="35" fill="#182b6f" stroke="#826efa" stroke-width="3"/><text x="600" y="1427" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#fff">Respuestas + trazas + seguridad + coste</text></svg>