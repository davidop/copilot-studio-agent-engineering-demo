name: Validate ElfoDesk Multi-Agent kit (offline)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate multi-agent specification and evaluation dataset
        run: python multiagent/validate.py
      - name: Validate legacy scenario matrix
        run: python tests/validar_matriz.py
      - name: Unit tests of repository integrity
        run: python -m unittest discover -s tests -p 'test_*.py' -v
# Only validates static samples and CSVs; NOT evaluation of deployed Copilot Studio agents.
