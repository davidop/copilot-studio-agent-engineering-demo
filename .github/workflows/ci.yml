name: Demo kit CI (offline)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate acceptance matrix
        run: python tests/validar_matriz.py
      - name: Local unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
# Offline checks ONLY. Not a Copilot Studio cloud evaluation.

