name: Render light Christmas carousel PNG
on:
  push:
    branches: [main]
    paths:
      - 'assets/carousel/1?-multiagent-*.svg'
      - 'scripts/render_carousel.py'
      - '.github/workflows/render-carousel.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SVG renderer
        run: python -m pip install --disable-pip-version-check 'CairoSVG==2.8.2'

      - name: Render four SVGs to PNG
        run: python scripts/render_carousel.py

      - name: Commit PNG exports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/carousel/1?-multiagent-*.png
          if ! git diff --cached --quiet; then
            git commit -m 'assets: render light Christmas multi-agent carousel PNG'
            git push
          else
            echo 'PNG files are already current.'
          fi
